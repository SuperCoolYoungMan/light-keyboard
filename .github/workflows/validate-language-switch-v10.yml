name: Validate Language Switch V10

on:
  push:
    branches: [korean-polish-language-switch-v10-ci]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Warm Gradle wrapper with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Gradle wrapper download failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run checks
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_CI_TOKEN }}
        run: ./gradlew check --stacktrace

      - name: Build debug APK
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_CI_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-korean-keyboard-language-switch-v10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
