name: Validate Tactile V4

on:
  push:
    branches: [korean-polish-tactile-v4-ci]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Warm Gradle wrapper with retry
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle wrapper download failed on attempt $attempt; retrying..."
            sleep $((attempt * 4))
          done
          exit 1

      - name: Run checks
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_CI_TOKEN }}
        run: ./gradlew check --stacktrace

      - name: Build debug APK
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_CI_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-korean-keyboard-tactile-v4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
